[package]
name = "rubber"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust-native Minecraft server and Fabric mod compatibility project"
license = "MIT"

[features]
java-poc = ["dep:jni"]

[dependencies]
jni = { version = "0.22.4", optional = true, features = ["invocation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
