[package]
name = "rubber"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust-native Minecraft server and Fabric mod compatibility project"
license = "MIT"

[features]
java-poc = ["dep:jni"]

[dependencies]
fastanvil = { version = "0.32.0", default-features = false }
fastnbt = "2.6.3"
flate2 = "1"
jni = { version = "0.22.4", optional = true, features = ["invocation"] }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "05f3f8b4f7c8268ccc420e6f3167cb05e53345fb", default-features = false, features = ["entity_id_remap", "item_id_remap", "packet", "registry", "tag"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
