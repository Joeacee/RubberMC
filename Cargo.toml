[package]
name = "rustabric-prototype"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust-based Fabric metadata inspector and loader foundation"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
